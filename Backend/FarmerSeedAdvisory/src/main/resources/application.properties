spring.application.name=FarmerSeedAdvisory

# ======================================================
# Server
# ======================================================
server.address=0.0.0.0
server.port=8080

# ======================================================
# Database  (MySQL)
# ======================================================
spring.datasource.url=jdbc:mysql://localhost:3306/farmer_seed_advisory?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ======================================================
# Firebase Admin SDK
# ======================================================
firebase.service-account.path=firebase-service-account.json
firebase.project-id=seedhybridadvisory

# ======================================================
# Weather API (WeatherAPI.com)
# ======================================================
weather.api.key=${WEATHER_API_KEY:YOUR_WEATHERAPI_KEY}
weather.base-url=https://api.weatherapi.com/v1/
weather.cache.ttl-minutes=30


# ======================================================
# LLM Configuration (Google Gemini + Local Ollama fallback)
# Reference: maize-seed-rag/.env
# ======================================================
llm.provider=gemini
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3-flash-preview}
gemini.fallback-models=gemini-3-flash-preview,gemini-flash-latest,gemini-3.8-flash,gemini-2.5-flash-lite,gemini-pro-latest
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models/
gemini.temperature=0.2

# Local Ollama Server (fallback)
llm.base-url=http://localhost:11434
llm.model=llama3
llm.timeout-seconds=120
llm.api-path=/api/generate

# ======================================================
# Maize Dataset
# ======================================================
maize.csv.path=classpath:data/maize_varieties.csv
maize.embeddings.path=classpath:data/embeddings.json

# ======================================================
# Soybean Dataset
# ======================================================
soybean.csv.path=classpath:data/soybean_varieties.csv

# ======================================================
# Cotton Dataset
# ======================================================
cotton.csv.path=classpath:data/cotton_varieties.csv

# ======================================================
# Recommendation Engine
# ======================================================
recommendation.max-candidates=10
recommendation.top-k=5

# ======================================================
# Logging
# ======================================================
logging.level.com.anootations.farmerseedadvisory=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

